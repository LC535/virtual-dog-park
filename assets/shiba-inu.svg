<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="shiba-title">
  <title id="shiba-title">Illustration of a Shiba Inu</title>
  <circle cx="120" cy="120" r="108" fill="#FFF3E3"/>

  <!-- slim body, small and upright -->
  <ellipse cx="118" cy="182" rx="44" ry="41" fill="#E9A45F"/>

  <!-- the curled tail sitting on the right hip -->
  <path d="M154 196c22 8 40-4 40-20 0-13-13-21-23-15-8 5-8 17 2 19" fill="none" stroke="#D98F47" stroke-width="15" stroke-linecap="round"/>

  <!-- small upright ears -->
  <path d="M86 78 L76 36 Q74 31 79 33 L110 60 Z" fill="#E9A45F" stroke="#E9A45F" stroke-width="7" stroke-linejoin="round"/>
  <path d="M154 78 L164 36 Q166 31 161 33 L130 60 Z" fill="#E9A45F" stroke="#E9A45F" stroke-width="7" stroke-linejoin="round"/>
  <path d="M87 72 L81 46 L103 62 Z" fill="#F6C79E"/>
  <path d="M153 72 L159 46 L137 62 Z" fill="#F6C79E"/>

  <!-- narrow fox-like head -->
  <path d="M120 62c-24 0-42 17-42 40 0 22 19 38 42 38s42-16 42-38c0-23-18-40-42-40Z" fill="#E9A45F"/>

  <!-- white cheeks and pointed urajiro muzzle -->
  <path d="M120 108c-13 0-22 8-22 18 0 12 10 22 22 30 12-8 22-18 22-30 0-10-9-18-22-18Z" fill="#FDF0DF"/>
  <ellipse cx="92" cy="112" rx="12" ry="10" fill="#FDF0DF"/>
  <ellipse cx="148" cy="112" rx="12" ry="10" fill="#FDF0DF"/>

  <!-- white chest -->
  <path d="M118 156c-13 0-22 12-22 27 0 13 9 21 22 21s22-8 22-21c0-15-9-27-22-27Z" fill="#FDF0DF"/>

  <!-- almond eyes -->
  <ellipse cx="102" cy="99" rx="7" ry="4.6" fill="#43312A" transform="rotate(-8 102 99)"/>
  <ellipse cx="138" cy="99" rx="7" ry="4.6" fill="#43312A" transform="rotate(8 138 99)"/>
  <circle cx="104" cy="97.5" r="1.7" fill="#FFF"/>
  <circle cx="140" cy="97.5" r="1.7" fill="#FFF"/>

  <!-- cream eyebrow dots: a Shiba signature -->
  <ellipse cx="103" cy="86" rx="5" ry="3.4" fill="#FBE0C4"/>
  <ellipse cx="137" cy="86" rx="5" ry="3.4" fill="#FBE0C4"/>

  <!-- nose and mouth -->
  <path d="M120 122c-4.5 0-7.5 2.6-7.5 5.2 0 2.8 3.6 5.3 7.5 5.3s7.5-2.5 7.5-5.3c0-2.6-3-5.2-7.5-5.2Z" fill="#43312A"/>
  <path d="M120 133v4" stroke="#43312A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M120 137q-7 6-13 1" stroke="#43312A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M120 137q7 6 13 1" stroke="#43312A" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- slim front legs -->
  <ellipse cx="102" cy="214" rx="12" ry="8" fill="#FDF0DF"/>
  <ellipse cx="136" cy="214" rx="12" ry="8" fill="#FDF0DF"/>
</svg>
