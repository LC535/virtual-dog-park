<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="corgi-title">
  <title id="corgi-title">Illustration of a Corgi</title>
  <circle cx="120" cy="120" r="108" fill="#FFF0DC"/>

  <!-- long, low body with four stubby legs -->
  <rect x="72" y="196" width="16" height="22" rx="7" fill="#C97A38"/>
  <rect x="152" y="196" width="16" height="22" rx="7" fill="#C97A38"/>
  <ellipse cx="120" cy="182" rx="68" ry="34" fill="#E28B45"/>
  <ellipse cx="120" cy="192" rx="44" ry="22" fill="#FFF8F0"/>

  <!-- oversized upright ears -->
  <path d="M80 86 Q52 16 70 14 Q92 16 112 62 Z" fill="#D2762F"/>
  <path d="M160 86 Q188 16 170 14 Q148 16 128 62 Z" fill="#D2762F"/>
  <path d="M84 74 Q66 30 74 28 Q88 32 102 62 Z" fill="#F5BE94"/>
  <path d="M156 74 Q174 30 166 28 Q152 32 138 62 Z" fill="#F5BE94"/>

  <!-- wide head -->
  <ellipse cx="120" cy="110" rx="45" ry="39" fill="#E28B45"/>

  <!-- wide white blaze down the face -->
  <path d="M120 72c-8 0-13 6-13 14 0 11 4 23 13 34 9-11 13-23 13-34 0-8-5-14-13-14Z" fill="#FFF8F0"/>

  <!-- muzzle, chin and tongue -->
  <ellipse cx="120" cy="136" rx="31" ry="19" fill="#FFF8F0"/>
  <path d="M114 150h12c1.6 0 2.6 1.6 2 3-1.8 4.6-5.8 7.6-8 7.6s-6.2-3-8-7.6c-.6-1.4.4-3 2-3Z" fill="#F28C8C"/>

  <!-- round cheerful eyes -->
  <circle cx="100" cy="104" r="6" fill="#3A2A22"/>
  <circle cx="140" cy="104" r="6" fill="#3A2A22"/>
  <circle cx="102" cy="102" r="2" fill="#FFF"/>
  <circle cx="142" cy="102" r="2" fill="#FFF"/>

  <!-- nose -->
  <path d="M120 126c-5 0-9 2.8-9 5.6 0 3 4 5.6 9 5.6s9-2.6 9-5.6c0-2.8-4-5.6-9-5.6Z" fill="#3A2A22"/>
  <path d="M120 137v5" stroke="#3A2A22" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- rosy cheeks -->
  <ellipse cx="92" cy="126" rx="9" ry="5" fill="#F5A97E" opacity="0.85"/>
  <ellipse cx="148" cy="126" rx="9" ry="5" fill="#F5A97E" opacity="0.85"/>
</svg>
